name: 'xccov2lcov tool'
description: 'Convert xccov and xcresult data to lcov'
author: 'Lukas Kollmer <contact@lukaskollmer.de>'
branding:
  icon: 'terminal'
  color: 'blue'
inputs:
  xcresult:
    description: 'xcresult bundle'
    required: true
  output:
    description: 'output file'
    required: false
    default: 'info.lcov'
runs:
  using: "composite"
  steps:
    - name: Run xccov2lcov
      shell: bash
      env:
        XCRESULT: ${{ inputs.xcresult }}
        OUTPUT: ${{ inputs.output }}
      # The tool is built from the action's own sources, so it always matches this version of the action.
      run: |
        xcrun xccov view --archive --json "$XCRESULT" \
          | xcrun swift run --quiet \
            --package-path "$GITHUB_ACTION_PATH" \
            --scratch-path "$RUNNER_TEMP/xccov2lcov" \
            --configuration release \
            xccov2lcov \
          > "$OUTPUT"
